<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Interests</title>

  <link rel="stylesheet" href="styles.css">

  <link href="https://fonts.googleapis.com/css2?family=DynaPuff&display=swap" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>

  <h1 class="interests-title">Interests</h1>

  <p class="interests-subtitle">Please Select Up to 5</p>

  <div class="card interests-card">

   <form class="interests-form">

  <label><input type="checkbox" id="food"> Food</label>

  <label><input type="checkbox" id="nature"> Nature</label>

  <label><input type="checkbox" id="art"> Art</label>

  <label><input type="checkbox" id="culture"> Culture</label>

  <label><input type="checkbox" id="hiking"> Hiking/Walking</label>

  <label><input type="checkbox" id="entertainment"> Entertainment</label>

  <label><input type="checkbox" id="wellness"> Wellness</label>

  <label><input type="checkbox" id="activities"> Activities</label>

  <label><input type="checkbox" id="adventures"> Adventures</label>

  <label><input type="checkbox" id="shopping"> Shopping</label>

</form>

  </div>

 <button type="button"
class="continue-button"
onclick="saveInterests()">
  Continue
</button>

<script src="scripts.js"></script>
</body>
</html>
